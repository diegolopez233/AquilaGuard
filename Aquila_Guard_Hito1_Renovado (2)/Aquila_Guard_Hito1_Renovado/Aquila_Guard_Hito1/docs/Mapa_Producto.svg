<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152d4d}.title{font-size:42px;font-weight:700}.sub{font-size:24px}.label{font-size:28px;font-weight:700}.small{font-size:23px}.tiny{font-size:21px}.line{fill:none;stroke:#5d7898;stroke-width:3}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5d7898"/></marker></defs><text x="65" y="75" class="title">Mapa del producto</text><text x="65" y="120" class="sub">Cinco secciones globales. Resultado es un estado dentro de Revisar.</text><rect x="610" y="175" width="380" height="100" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="632" y="217" class="label">Aquila Guard</text><text x="632" y="257" class="small">Navegación global</text><path class="line" d="M800 275V330H180V375M800 330H490V375M800 330V375M800 330H1110V375M1110 330H1420V375"/><rect x="45" y="375" width="270" height="205" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="67" y="417" class="label">Inicio</text><text x="67" y="457" class="small">Promesa</text><text x="67" y="489" class="small">Recorrido</text><text x="67" y="521" class="small">Actividad reciente</text><rect x="355" y="375" width="270" height="205" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="377" y="417" class="label">Revisar</text><text x="377" y="457" class="small">Enlace / correo</text><text x="377" y="489" class="small">Mensaje / teléfono</text><text x="377" y="521" class="small">Resultado y razones</text><rect x="665" y="375" width="270" height="205" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="687" y="417" class="label">Alertas</text><text x="687" y="457" class="small">Fichas de la sesión</text><text x="687" y="489" class="small">Marcar revisadas</text><rect x="975" y="375" width="270" height="205" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="997" y="417" class="label">Resumen</text><text x="997" y="457" class="small">Total revisado</text><text x="997" y="489" class="small">Señales y pendientes</text><rect x="1285" y="375" width="270" height="205" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="1307" y="417" class="label">Ajustes</text><text x="1307" y="457" class="small">Texto grande</text><text x="1307" y="489" class="small">Privacidad</text><text x="1307" y="521" class="small">Borrar sesión</text><rect x="355" y="630" width="580" height="115" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="377" y="672" class="label">Resultado de ejemplo</text><text x="377" y="712" class="small">Recomendación y límites. Continúa a Alertas.</text><path class="line" d="M490 580V630"/><text x="65" y="825" class="label">Recorrido de demostración</text><text x="65" y="875" class="sub">Inicio  →  Revisar  →  Resultado  →  Alertas  →  Resumen</text><text x="65" y="930" class="small">Ajustes está disponible desde cualquier sección. Atrás y Adelante usan el fragmento de URL.</text><text x="65" y="985" class="tiny">Rutas: #inicio, #revisar, #alertas, #resumen, #ajustes. No existen cuentas ni inicio de sesión.</text></svg>