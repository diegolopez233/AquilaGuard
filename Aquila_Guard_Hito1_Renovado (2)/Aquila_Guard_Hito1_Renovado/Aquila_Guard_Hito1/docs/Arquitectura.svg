<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152d4d}.title{font-size:42px;font-weight:700}.sub{font-size:24px}.label{font-size:28px;font-weight:700}.small{font-size:23px}.tiny{font-size:21px}.line{fill:none;stroke:#5d7898;stroke-width:3}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5d7898"/></marker></defs><text x="65" y="75" class="title">Arquitectura de Aquila Guard</text><text x="65" y="120" class="sub">Estado del Hito 1 y diseño propuesto para el producto</text><rect x="65" y="185" width="500" height="265" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="87" y="227" class="label">Actual en el Hito 1</text><text x="87" y="267" class="small">Navegador web en computador o móvil</text><text x="87" y="299" class="small">HTML + assets/app.css + src/app.js</text><text x="87" y="331" class="small">Reglas educativas y sesión en memoria</text><text x="87" y="363" class="small">Sin llamadas a API ni base conectada</text><text x="87" y="395" class="small">Recargar elimina los resultados</text><text x="650" y="185" class="label">PROPUESTA POR IMPLEMENTAR</text><rect x="650" y="220" width="870" height="160" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="672" y="262" class="label">Cliente React + TypeScript</text><text x="672" y="302" class="small">RevisarForm / Resultado / Alertas</text><text x="672" y="334" class="small">Presenta datos y valida formato</text><rect x="650" y="435" width="870" height="160" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="672" y="477" class="label">API Node.js + Express + TypeScript</text><text x="672" y="517" class="small">AnalisisController: valida HTTP / JSON</text><text x="672" y="549" class="small">AnalisisService: aplica reglas y límites</text><rect x="650" y="650" width="870" height="160" rx="6" fill="#f1f5fa" stroke="#92a7bf" stroke-width="2"/><text x="672" y="692" class="label">Datos y persistencia</text><text x="672" y="732" class="small">AnalisisRepository / AlertaRepository</text><text x="672" y="764" class="small">PostgreSQL: analisis y alertas</text><path class="line" marker-end="url(#a)" d="M1085 380V430"/><text x="1110" y="411" class="tiny">HTTPS · JSON · petición y respuesta</text><path class="line" marker-end="url(#a)" d="M1085 595V645"/><text x="1110" y="627" class="tiny">Consultas parametrizadas y retorno</text><text x="65" y="900" class="label">Caso de uso propuesto</text><text x="65" y="950" class="small">RevisarForm envía el contenido a AnalisisController. AnalisisService produce razones.</text><text x="65" y="995" class="small">Los repositorios guardan el análisis y su ficha. El resultado vuelve por las mismas capas.</text><text x="65" y="1045" class="tiny">Los nombres de componentes futuros describen el diseño. No acreditan un servidor operativo.</text></svg>